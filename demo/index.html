<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoadSystem Demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #dfe8f1; }
    canvas { display: block; }
    .panel { position: fixed; padding: 8px 10px; background: rgba(10,14,20,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; }
    #hud { left: 12px; top: 12px; pointer-events: none; white-space: pre; }
    #tools { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
    #tools label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    #tools button, #tools select { font: inherit; padding: 4px 8px; color: inherit; background: #1c2633; border: 1px solid #38485c; border-radius: 4px; cursor: pointer; }
    #tools button:hover { background: #26354a; }
    #tools button.on { background: #2f6f4a; border-color: #4fae78; }
    #msg { color: #9fb3c8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="hud" class="panel">lade …</div>
  <div id="tools" class="panel">
    <label>Profil <select id="profile"></select></label>
    <button id="draw">Straße zeichnen (D)</button>
    <button id="finish">Fertig (Enter)</button>
    <button id="undo">Letzten Punkt entfernen (⌫)</button>
    <button id="cancel">Abbrechen (Esc)</button>
    <button id="clear">Alle Straßen löschen</button>
    <label><span>Debug-Linien</span><input id="debug" type="checkbox" /></label>
    <div id="msg">Zeichnen: Klick aufs Gelände setzt Punkte. Ziehen = Kamera drehen.</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
